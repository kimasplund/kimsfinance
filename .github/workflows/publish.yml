# Publish kimsfinance (pure Python) and kimsfinance_core (Rust extension) to PyPI.
#
# Authentication uses PyPI trusted publishing (OIDC), so no API-token secrets
# are needed. One-time setup on pypi.org (and test.pypi.org for the dry-run
# path) for EACH of the two projects:
#   Publishing -> Add a new pending publisher
#     Owner: kimasplund   Repository: kimsfinance
#     Workflow name: publish.yml
#     Environment: pypi   (testpypi for the TestPyPI publisher)
# and create the `pypi` and `testpypi` environments under the repository's
# Settings -> Environments (an environment protection rule is recommended).
#
# Triggers:
#   - a published GitHub release  -> PyPI
#   - workflow_dispatch           -> TestPyPI (dry run of the whole pipeline)

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-python:
    name: Build kimsfinance sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist-kimsfinance
          path: dist/

  build-core:
    name: Build kimsfinance_core (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # abi3-py313 wheels: one wheel per platform covers every Python >= 3.13.
        target: [x86_64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path rust/Cargo.toml

      - name: Build sdist
        if: matrix.target == 'x86_64'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path rust/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: dist-core-${{ matrix.target }}
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build-python, build-core]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          verbose: true

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build-python, build-core]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true
