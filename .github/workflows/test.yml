name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux-only: the project targets Linux + NVIDIA/CUDA. macOS/Windows
        # have pre-existing platform-specific test fragilities (Windows file-
        # handle locking in save tests; macOS path-validation semantics) that
        # are tracked separately. Re-add those OSes once those tests are hardened.
        os: [ubuntu-latest]
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # [test] pulls the optional test deps (svgwrite, mplfinance, pyarrow, ...)
        # so renderer/IO tests run instead of erroring on missing imports.
        # [jit] installs numba so the JIT code paths are exercised for real:
        # without it the numba tests silently run their pure-Python fallback.
        pip install -e ".[test,jit]"
        pip install maturin

    - name: Build and install Rust extension (kimsfinance_core)
      run: |
        # Default (CPU) features only — the `gpu` feature needs CUDA/nvcc.
        # Without this extension the Rust-backed indicator/backtest tests fail.
        maturin build -m rust/Cargo.toml --out dist
        pip install --no-index --find-links dist kimsfinance_core

    - name: Run tests
      run: |
        # GPU-hardware tests skip automatically when no usable device is present.
        pytest tests/ -v --tb=short

    - name: Test import
      run: |
        python -c "from kimsfinance.plotting import render_ohlcv_chart; print('Import successful')"

  rust:
    # CPU-only checks of the kimsfinance_core crate on default features.
    # The gpu feature needs CUDA/nvcc and a device; see cuda-benchmark.yml.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
    - uses: actions/checkout@v7

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust

    - name: Formatting (cargo fmt)
      run: cargo fmt --all -- --check

    - name: Lint (cargo clippy)
      run: cargo clippy --lib --tests --no-deps -- -D warnings

    - name: Check every target compiles
      run: cargo check --all-targets

    - name: Unit and integration tests
      run: cargo test --lib --tests
