[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kimsfinance"
version = "0.2.0"
description = "Blazing-fast financial charting for quantitative trading - 194x average speedup (764x peak) with Rust CPU, GPU persistent kernels (41x batch), and production-ready quality. Built for hedge funds, algo traders, and quants."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Kim Asplund", email = "hello@asplund.kim"}
]
maintainers = [
    {name = "Kim Asplund", email = "hello@asplund.kim"}
]
keywords = ["finance", "trading", "gpu", "candlestick", "charts", "visualization", "cuda", "webp", "performance", "quantitative", "quant", "ohlc", "ohlcv", "algorithmic-trading", "technical-analysis", "polars", "numpy", "hedge-fund", "high-frequency", "rust", "numba", "jit", "persistent-kernels", "backtesting", "rapids", "cudf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

dependencies = [
    "polars>=1.0",
    "numpy>=2.0",
    "Pillow>=12.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
pandas = [
    # pandas interop only (accepting/identifying pandas DataFrames & Series).
    # The core data path is Polars + NumPy, so pandas is no longer a hard
    # dependency -- install kimsfinance[pandas] if you pass pandas objects.
    "pandas>=2.0",
]
gpu = [
    "cudf-cu13>=25.10",  # CUDA 13 support (RTX 3500 Ada) - 25.10 is latest available
    "cupy-cuda13x>=13.0",  # CUDA 13 support
]
jit = [
    "numba>=0.59",  # Python 3.13 support
]
optimization = [
    "deap>=1.4",  # Genetic algorithm optimization (NSGA-II)
]
reporting = [
    "reportlab>=4.0",  # PDF report generation
    "matplotlib>=3.5",  # Chart generation for reports
    "pandas>=2.0",  # reporting metrics/tables are built on pandas
]
interactive = [
    "plotly>=5.0",  # Interactive Plotly charts
    "bokeh>=3.0",  # Interactive Bokeh charts
    "kaleido>=0.2",  # PNG export for Plotly (optional)
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "tox>=4.0",
    "pandas>=2.0",  # so type-checkers (mypy) can resolve the optional pandas interop
]
test = [
    "kimsfinance[dev]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=5.1.0",
    "mplfinance>=0.12.10b0",
    "pyarrow>=15.0",
    "svgwrite>=1.4",
    "pandas>=2.0",  # the test suite exercises the pandas interop paths
]
all = [
    "kimsfinance[pandas,gpu,jit,optimization,reporting,interactive,dev,test]",
]

[project.urls]
Homepage = "https://asplund.kim"
Documentation = "https://github.com/kimasplund/kimsfinance#readme"
"Rust Documentation" = "https://github.com/kimasplund/kimsfinance/tree/master/rust#readme"
Repository = "https://github.com/kimasplund/kimsfinance"
Issues = "https://github.com/kimasplund/kimsfinance/issues"
"Commercial License" = "https://github.com/kimasplund/kimsfinance/blob/master/COMMERCIAL-LICENSE.md"
Funding = "https://github.com/kimasplund/kimsfinance#funding"

[tool.setuptools.packages.find]
where = ["."]
include = ["kimsfinance*"]

[tool.setuptools.package-data]
kimsfinance = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py313', 'py314']

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks performance benchmark tests",
]
