[tox]
# Default envs mirror the CI test matrix (.github/workflows/test.yml: 3.13, 3.14).
# py314-freethreaded is opt-in: `tox -e py314-freethreaded` (see docs/PYTHON_314.md).
envlist = py313,py314
skipsdist = False

[testenv]
description = Run the test suite against a freshly built kimsfinance_core extension
# [test] is a superset of [dev] and pulls the optional libraries the tests import
# (pandas, pyarrow, mplfinance, svgwrite, ...), matching what CI installs.
extras = test
deps =
    maturin>=1.9,<2.0
passenv =
    CUDA_VISIBLE_DEVICES
    POLARS_GPU_ENABLED
    CARGO_HOME
    CARGO_TARGET_DIR
    RUSTUP_HOME
    RUSTUP_TOOLCHAIN
# Build and install the Rust extension (default CPU features; `gpu` needs nvcc) into
# this env's virtualenv, otherwise the Rust-backed indicator/backtest tests fail.
commands_pre =
    maturin develop -m {toxinidir}/rust/Cargo.toml --release
commands =
    python -m pytest tests/ {posargs}

[testenv:py313]
basepython = python3.13
description = Test with Python 3.13

[testenv:py314]
basepython = python3.14
description = Test with Python 3.14

[testenv:py314-freethreaded]
basepython = python3.14t
description = Test with Python 3.14 free-threading build (opt-in, not in CI)
setenv =
    PYTHON_GIL = 0

[testenv:benchmark]
basepython = python3.14
description = Run only tests marked @pytest.mark.benchmark (pytest-benchmark via [test])
commands =
    python -m pytest tests/ -m benchmark {posargs}
