[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "kimsfinance_core"
version = "0.2.0"
description = "High-performance Rust-accelerated backtesting and technical analysis library"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.5",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.5",
    "pandas>=2.0",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "pandas>=2.0",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/kimasplund/kimsfinance"
Repository = "https://github.com/kimasplund/kimsfinance"
Documentation = "https://github.com/kimasplund/kimsfinance/tree/master/rust"

[tool.maturin]
# Build settings for maturin
features = ["pyo3/extension-module"]
module-name = "kimsfinance_core"
