[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "kimsfinance_core"
version = "0.1.0"
description = "High-performance Rust implementation for kimsfinance coordinate calculations"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/kimasplund/kimsfinance"
Repository = "https://github.com/kimasplund/kimsfinance"

[tool.maturin]
# Build settings for maturin
features = ["pyo3/extension-module"]
module-name = "kimsfinance_core"
