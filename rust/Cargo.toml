[package]
name = "kimsfinance_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"

[lib]
name = "kimsfinance_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py313"] }
numpy = "0.27.0"
ndarray = { version = "0.16.1", features = ["rayon"] }
rayon = "1.11.0"

# Optional SIMD support
packed_simd_2 = { version = "0.3.8", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[features]
default = ["simd"]
simd = []
explicit_simd = ["packed_simd_2"]

[[bench]]
name = "momentum_indicators"
harness = false

[[bench]]
name = "moving_averages"
harness = false

[[bench]]
name = "volatility_indicators"
harness = false

[[bench]]
name = "volume_indicators"
harness = false
