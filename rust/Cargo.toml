[package]
name = "kimsfinance_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "kimsfinance_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py313"] }
numpy = "0.27.0"
ndarray = "0.16.1"
rayon = "1.11.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[features]
default = ["simd"]
simd = []
