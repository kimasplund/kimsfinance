[package]
name = "kimsfinance_core"
version = "0.2.0"
edition = "2024"
rust-version = "1.90.0"

[lib]
name = "kimsfinance_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py313"] }
numpy = "0.27.0"
ndarray = { version = "0.16.1", features = ["rayon"] }
rayon = "1.11.0"
serde_json = "1.0"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
zip = "6.0.0"
rand = "0.9"
rand_distr = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

# Async runtime and traits
tokio = { version = "1.42", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }

# HTTP client for data downloaders
reqwest = { version = "0.12", features = ["json", "cookies"], optional = true }

# Yahoo Finance with TLS impersonation (Chrome fingerprint)
rquest = { version = "5.1", features = ["json", "cookies"], optional = true }
scraper = { version = "0.21", optional = true }  # HTML parsing for consent forms
regex = { version = "1.11", optional = true }     # Crumb extraction
once_cell = { version = "1.20", optional = true } # Singleton session

# Parquet file format for data storage
arrow = { version = "54.0", optional = true }
parquet = { version = "54.0", features = ["arrow"], optional = true }

# Options data connectors (optional)
ibapi = { version = "2.0", optional = true }
time = { version = "0.3", optional = true }
deribit = { version = "0.3", optional = true }

# Performance dependencies for backtest optimization
dashmap = "6.1"
arrayvec = "0.7"
smallvec = "1.13"
parking_lot = "0.12"
sha2 = "0.10"  # For kernel cache hashing

# Optional SIMD support


# Optional GPU support with cudarc (v0.17.3 - pinned for stability)
# CUDA Toolkit Compatibility:
#   - Feature flag: cuda-13000 (CUDA 13.0 PTX compilation) ✅
#   - Toolkit installed: CUDA 12.4 (nvcc)
#   - Current driver: 580.82.07 (CUDA 13.0) ✅
#
# CUDA 13.0 Performance Improvements (runtime-enabled, no code changes needed):
#   - Math library optimizations:
#     * ldexp(): 3x faster (double precision)
#     * sinh()/cosh(): 50% faster (hyperbolic functions)
#     * Improved accuracy for edge cases
#   - Stream-ordered memory allocator: 10-20% faster allocation
#   - CUDA Graphs: 30-50% launch overhead reduction (requires API integration)
#   - Better GPU occupancy for small kernels
#
# Note: cudarc 0.17.3 is latest stable. CUDA 13.0 runtime features are automatically
# enabled when driver supports them. No library upgrade needed for:
#   ✅ Math library speedups (automatic)
#   ⚠️ Stream-ordered malloc (requires cudarc API addition)
#   ⚠️ CUDA Graphs (requires cudarc API addition)
cudarc = { version = "=0.17.3", optional = true, features = ["driver", "cublas", "nvrtc", "cuda-13000"] }
half = { version = "2.4", optional = true }  # For f16 support

# Optimization libraries for Heston calibration
argmin = { version = "0.11", optional = true }
argmin-math = { version = "0.5", default-features = false, features = ["ndarray_v0_16"], optional = true }
ndarray-linalg = { version = "0.17", features = ["intel-mkl-static"], optional = true }

# FFT library for Carr-Madan option pricing
rustfft = { version = "6.2", optional = true }
num-complex = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.14"
proptest = "1.4"
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[features]
default = ["simd"]
simd = []

gpu = ["cudarc", "half"]

# IEEE-754-strict GPU compilation (no -use_fast_math / denormal-flush; 0.5-ULP
# div/sqrt) for bit-reproducible signal/backtest kernels. Off by default (fast).
strict-fp = []

# Options data connectors
data-ibkr = ["ibapi", "time", "tokio", "async-trait"]
data-deribit = ["deribit", "tokio", "async-trait"]
data-downloaders = ["tokio", "async-trait", "reqwest", "arrow", "parquet"]
data-yahoo-tls = ["data-downloaders", "rquest", "scraper", "regex", "once_cell"]
data-all = ["data-ibkr", "data-deribit", "data-downloaders", "data-yahoo-tls"]
heston = ["gpu", "argmin", "argmin-math", "rustfft", "num-complex", "ndarray-linalg"]

