[package]
name = "kimsfinance_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"

[lib]
name = "kimsfinance_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py313"] }
numpy = "0.27.0"
ndarray = { version = "0.16.1", features = ["rayon"] }
rayon = "1.11.0"
serde_json = "1.0"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
zip = "6.0.0"

# Optional SIMD support
packed_simd_2 = { version = "0.3.8", optional = true }

# Optional GPU support with cudarc (v0.17.3 - pinned for stability)
# Note: Using cuda-12080 (CUDA 12.8.0) - compatible with your CUDA 13.0 driver
cudarc = { version = "=0.17.3", optional = true, features = ["driver", "cublas", "nvrtc", "cuda-12080"] }
half = { version = "2.4", optional = true }  # For f16 support

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[features]
default = ["simd"]
simd = []
explicit_simd = ["packed_simd_2"]
gpu = ["cudarc", "half"]

[[bench]]
name = "momentum_indicators"
harness = false

[[bench]]
name = "moving_averages"
harness = false

[[bench]]
name = "volatility_indicators"
harness = false

[[bench]]
name = "volume_indicators"
harness = false

[[bench]]
name = "rolling_minmax"
harness = false

[[bench]]
name = "binance_gpu_benchmark"
harness = false
required-features = ["gpu"]
