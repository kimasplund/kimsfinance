[package]
name = "kimsfinance_core"
version = "0.2.0"
edition = "2024"
rust-version = "1.90.0"

[lib]
name = "kimsfinance_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py313"] }
numpy = "0.27.0"
ndarray = { version = "0.16.1", features = ["rayon"] }
rayon = "1.11.0"
serde_json = "1.0"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
zip = "6.0.0"
rand = "0.8"
rand_distr = "0.4"
chrono = "0.4"

# Performance dependencies for backtest optimization
dashmap = "6.1"
arrayvec = "0.7"
smallvec = "1.13"
parking_lot = "0.12"
sha2 = "0.10"  # For kernel cache hashing

# Optional SIMD support
packed_simd_2 = { version = "0.3.8", optional = true }

# Optional GPU support with cudarc (v0.17.3 - pinned for stability)
# CUDA Toolkit Compatibility:
#   - Feature flag: cuda-12080 (CUDA 12.8.0 PTX compilation)
#   - Runtime compatible with CUDA 13.0 driver (forward compatibility)
#   - Current driver: 580.82.07 (CUDA 13.0) ✅
#
# CUDA 13.0 Performance Improvements (runtime-enabled, no code changes needed):
#   - Math library optimizations:
#     * ldexp(): 3x faster (double precision)
#     * sinh()/cosh(): 50% faster (hyperbolic functions)
#     * Improved accuracy for edge cases
#   - Stream-ordered memory allocator: 10-20% faster allocation
#   - CUDA Graphs: 30-50% launch overhead reduction (requires API integration)
#   - Better GPU occupancy for small kernels
#
# Note: cudarc 0.17.3 is latest stable. CUDA 13.0 runtime features are automatically
# enabled when driver supports them. No library upgrade needed for:
#   ✅ Math library speedups (automatic)
#   ⚠️ Stream-ordered malloc (requires cudarc API addition)
#   ⚠️ CUDA Graphs (requires cudarc API addition)
cudarc = { version = "=0.17.3", optional = true, features = ["driver", "cublas", "nvrtc", "cuda-12080"] }
half = { version = "2.4", optional = true }  # For f16 support

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
chrono = "0.4"
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[features]
default = ["simd"]
simd = []
explicit_simd = ["packed_simd_2"]
gpu = ["cudarc", "half"]

